<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>MyCrew</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; margin: 0; height: 100vh; }
    #sidebar { width: 200px; background: #1a2744; padding: 20px; color: white; }
    #sidebar h2 { margin-bottom: 20px; }
    #sidebar button { width: 100%; padding: 10px; margin-bottom: 10px; background: #0077a8; color: white; border: none; border-radius: 5px; cursor: pointer; }
    #main { flex: 1; display: flex; flex-direction: column; }
    #menu { background: #0d3b6e; padding: 10px; display: flex; gap: 10px; }
    #menu button { padding: 8px 15px; background: #2e7d32; color: white; border: none; border-radius: 5px; cursor: pointer; }
    #content { display: flex; flex: 1; }
    #workspace { flex: 1; padding: 20px; background: #f5f5f5; position: relative; }
    #properties { width: 250px; background: #fff; padding: 20px; border-left: 1px solid #ddd; }
    .block { background: white; border: 2px solid #0077a8; border-radius: 8px; padding: 15px; margin: 10px; cursor: pointer; display: inline-block; min-width: 150px; }
    .block.agent { border-color: #2e7d32; }
    .block.task { border-color: #ff9500; }
    .block.selected { box-shadow: 0 0 10px rgba(0,119,168,0.5); }
    #result { background: #1e1e1e; color: #d4d4d4; padding: 15px; margin: 10px; border-radius: 5px; font-family: monospace; max-height: 200px; overflow-y: auto; }
    h1 { color: white; margin: 0; padding: 10px; background: #0d3b6e; }
  </style>
</head>
<body>
  <div id="sidebar">
    <h2>MyCrew</h2>
    <button onclick="addAgent()">➕ Ajouter Agent</button>
    <button onclick="addTask()">📋 Ajouter Tâche</button>
  </div>
  <div id="main">
    <h1>MyCrew – Outil Multi-Agents IA</h1>
    <div id="menu">
      <button onclick="runWorkflow()">▶ Exécuter</button>
      <button onclick="clearWorkspace()">🗑 Effacer</button>
      <button onclick="saveWorkflow()">💾 Sauvegarder</button>
      <button onclick="loadWorkflow()">📂 Charger</button>
    </div>
    <div id="content">
      <div id="workspace">
        <p style="color:#999">Ajoutez des agents et des tâches depuis la sidebar...</p>
      </div>
      <div id="properties">
        <h3>Propriétés</h3>
        <p id="propContent">Sélectionnez un bloc</p>
      </div>
    </div>
    <div id="result">En attente d'exécution...</div>
  </div>
  <script>
    let blocks = [];
    let selected = null;

    function addAgent() {
      const name = prompt('Nom de l agent :') || 'Agent';
      const prompt_ = prompt('Prompt de l agent :') || 'Tu es un assistant IA';
      const block = { type: 'agent', name, prompt: prompt_, id: Date.now() };
      blocks.push(block);
      renderBlocks();
    }

    function addTask() {
      const desc = prompt('Description de la tâche :') || 'Tâche';
      const input = prompt('Input de la tâche :') || '';
      const block = { type: 'task', desc, input, id: Date.now() };
      blocks.push(block);
      renderBlocks();
    }

    function renderBlocks() {
      const ws = document.getElementById('workspace');
      ws.innerHTML = blocks.map(b => `
        <div class="block ${b.type} ${selected === b.id ? 'selected' : ''}"
             onclick="selectBlock(${b.id})">
          <strong>${b.type === 'agent' ? '🤖 ' + b.name : '📋 ' + b.desc}</strong>
          <br><small>${b.type === 'agent' ? b.prompt : b.input}</small>
        </div>`).join('');
    }

    function selectBlock(id) {
      selected = id;
      const block = blocks.find(b => b.id === id);
      document.getElementById('propContent').innerHTML = block.type === 'agent'
        ? `<b>Type:</b> Agent<br><b>Nom:</b> ${block.name}<br><b>Prompt:</b> ${block.prompt}`
        : `<b>Type:</b> Tâche<br><b>Description:</b> ${block.desc}<br><b>Input:</b> ${block.input}`;
      renderBlocks();
    }

    async function runWorkflow() {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Exécution en cours...';
      const tasks = blocks.filter(b => b.type === 'task');
      if (tasks.length === 0) { resultDiv.textContent = 'Aucune tâche à exécuter !'; return; }
      try {
        const response = await fetch('/api/run', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tasks })
        });
        const data = await response.json();
        resultDiv.textContent = data.results.join('\n\n');
      } catch(e) {
        resultDiv.textContent = 'Erreur : ' + e.message;
      }
    }

    function clearWorkspace() { blocks = []; selected = null; renderBlocks(); }

    function saveWorkflow() {
      localStorage.setItem('workflow', JSON.stringify(blocks));
      alert('Workflow sauvegardé !');
    }

    function loadWorkflow() {
      const saved = localStorage.getItem('workflow');
      if (saved) { blocks = JSON.parse(saved); renderBlocks(); alert('Workflow chargé !'); }
      else alert('Aucun workflow sauvegardé !');
    }
  </script>
</body>
</html>
